<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Hello, world! 👋</h1>
    <p class="subtitle">Welcome to your test website.</p>

    <p class="clock" id="clock" aria-live="off"></p>

    <section>
      <h2>Click counter</h2>
      <button id="counter-btn" type="button">Clicked 0 times</button>
    </section>

    <section>
      <h2>Pick a theme</h2>
      <div class="themes">
        <button type="button" data-theme="sunset">Sunset</button>
        <button type="button" data-theme="ocean">Ocean</button>
        <button type="button" data-theme="forest">Forest</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
